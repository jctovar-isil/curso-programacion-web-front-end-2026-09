<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PetMatch | Listado de mascotas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </head>
  <body>
    <main class="container py-4">
      <header class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">
        <div>
          <h1 class="mb-1">Listado de mascotas</h1>
          <p class="text-body-secondary mb-0">Administra las mascotas registradas en PetMatch.</p>
        </div>
        <button type="button" id="newBtn" class="btn btn-primary">+ Nueva mascota</button>
      </header>

      <section class="card shadow-sm">
        <form id="petForm" class="row g-3 p-4 border-bottom" hidden>
          <input type="hidden" id="petId" />
          <div class="col-md-6">
            <label for="nombre" class="form-label">Nombre</label><input id="nombre" class="form-control" required />
          </div>
          <div class="col-md-6">
            <label for="especie" class="form-label">Especie</label><input id="especie" class="form-control" required />
          </div>
          <div class="col-md-6">
            <label for="raza" class="form-label">Raza</label><input id="raza" class="form-control" required />
          </div>
          <div class="col-md-6">
            <label for="edad" class="form-label">Edad</label
            ><input id="edad" class="form-control" type="number" min="0" required />
          </div>
          <div class="col-12">
            <label for="foto" class="form-label">URL de foto</label
            ><input id="foto" class="form-control" type="url" placeholder="https://..." />
          </div>
          <div class="col-12 form-check">
            <input id="esSano" class="form-check-input" type="checkbox" checked />
            <label for="esSano" class="form-check-label">Está sano</label>
          </div>
          <div class="col-12 d-flex gap-2">
            <button type="submit" class="btn btn-success">Guardar</button
            ><button type="button" class="btn btn-outline-secondary" id="cancelBtn">
              Cancelar
            </button>
          </div>
        </form>
        <div id="message" class="mx-4 mt-4" role="status" aria-live="polite"></div>
        <div class="table-responsive">
          <table class="table table-striped table-hover align-middle mb-0">
            <thead>
              <tr>
                <th>Foto</th>
                <th>Nombre</th>
                <th>Especie</th>
                <th>Raza</th>
                <th>Edad</th>
                <th>Estado</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="petList">
              <tr>
                <td colspan="7" class="text-center text-body-secondary py-4">Cargando mascotas...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>
    <script>
      const API = "http://localhost:3000/api/mascotas";
      const form = document.getElementById("petForm"),
        list = document.getElementById("petList"),
        message = document.getElementById("message");
      const fields = ["nombre", "especie", "raza", "edad", "foto"];
      const showMessage = (text) => {
        message.className = "alert alert-info mx-4 mt-4";
        message.textContent = text;
      };
      async function loadPets() {
        try {
          const response = await fetch(API);
          if (!response.ok) throw new Error();
          const pets = await response.json();
          render(pets);
        } catch {
          list.innerHTML =
            '<tr><td colspan="7" class="text-center text-body-secondary py-4">No se pudo conectar con el API.</td></tr>';
          showMessage(
            "Verifica que el servidor esté ejecutándose en localhost:3000.",
          );
        }
      }
      function render(pets) {
        if (!pets.length) {
          list.innerHTML =
            '<tr><td colspan="7" class="text-center text-body-secondary py-4">No hay mascotas registradas.</td></tr>';
          return;
        }
        list.innerHTML = pets
          .map(
            (p) =>
              `<tr><td><img class="img-fluid rounded" style="width: 4rem; height: 4rem; object-fit: cover;" src="${p.foto || ""}" alt="Foto de ${p.nombre}" onerror="this.style.visibility='hidden'"></td><td>${p.nombre}</td><td>${p.especie}</td><td>${p.raza}</td><td>${p.edad}</td><td><span class="badge ${p.esSano ? "text-bg-success" : "text-bg-warning"}">${p.esSano ? "Sano" : "Necesita atención"}</span></td><td><div class="d-flex flex-wrap gap-2"><button type="button" class="btn btn-sm btn-outline-primary" onclick="editPet('${p._id || p.id}')">Editar</button><button type="button" class="btn btn-sm btn-outline-danger" onclick="deletePet('${p._id || p.id}')">Eliminar</button></div></td></tr>`,
          )
          .join("");
      }
      document.getElementById("newBtn").onclick = () => {
        form.reset();
        document.getElementById("petId").value = "";
        document.getElementById("esSano").checked = true;
        form.hidden = false;
      };
      document.getElementById("cancelBtn").onclick = () => (form.hidden = true);
      form.onsubmit = async (e) => {
        e.preventDefault();
        const id = document.getElementById("petId").value;
        const data = Object.fromEntries(
          fields.map((f) => [
            f,
            f === "edad"
              ? Number(document.getElementById(f).value)
              : document.getElementById(f).value,
          ]),
        );
        data.esSano = document.getElementById("esSano").checked;
        try {
          const r = await fetch(id ? `${API}/${id}` : API, {
            method: id ? "PUT" : "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data),
          });
          if (!r.ok) throw new Error();
          form.hidden = true;
          showMessage("Mascota guardada correctamente.");
          loadPets();
        } catch {
          showMessage("No se pudo guardar la mascota.");
        }
      };
      window.editPet = async (id) => {
        try {
          const r = await fetch(`${API}/${id}`);
          const p = await r.json();
          document.getElementById("petId").value = id;
          fields.forEach(
            (f) => (document.getElementById(f).value = p[f] ?? ""),
          );
          document.getElementById("esSano").checked = !!p.esSano;
          form.hidden = false;
        } catch {
          showMessage("No se pudo cargar la mascota.");
        }
      };
      window.deletePet = async (id) => {
        if (!confirm("¿Eliminar esta mascota?")) return;
        try {
          const r = await fetch(`${API}/${id}`, { method: "DELETE" });
          if (!r.ok) throw new Error();
          showMessage("Mascota eliminada.");
          loadPets();
        } catch {
          showMessage("No se pudo eliminar la mascota.");
        }
      };
      loadPets();
    </script>
  </body>
</html>
