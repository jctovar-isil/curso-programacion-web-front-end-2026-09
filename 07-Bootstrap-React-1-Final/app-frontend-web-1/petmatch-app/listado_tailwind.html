<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PetMatch | Listado de mascotas</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body>
    <main class="mx-auto max-w-7xl px-4 py-8 sm:px-6 lg:px-8">
      <header class="mb-8 flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
        <div>
          <h1 class="text-3xl font-bold tracking-tight text-slate-900">Listado de mascotas</h1>
          <p class="mt-1 text-sm text-slate-600">Administra las mascotas registradas en PetMatch.</p>
        </div>
        <button type="button" id="newBtn" class="rounded-md bg-red-600 px-4 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:bg-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-600 focus:ring-offset-2">+ Nueva mascota</button>
      </header>

      <section class="overflow-hidden rounded-lg border border-slate-200 bg-white shadow-sm">
        <form id="petForm" class="grid grid-cols-1 gap-5 border-b border-slate-200 p-6 sm:grid-cols-2" hidden>
          <input type="hidden" id="petId" />
          <div>
            <label for="nombre" class="mb-1.5 block text-sm font-medium text-slate-700">Nombre</label><input id="nombre" class="block w-full rounded-md border-slate-300 px-3 py-2 text-sm shadow-sm focus:border-indigo-500 focus:ring-indigo-500" required />
          </div>
          <div>
            <label for="especie" class="mb-1.5 block text-sm font-medium text-slate-700">Especie</label><input id="especie" class="block w-full rounded-md border-slate-300 px-3 py-2 text-sm shadow-sm focus:border-indigo-500 focus:ring-indigo-500" required />
          </div>
          <div>
            <label for="raza" class="mb-1.5 block text-sm font-medium text-slate-700">Raza</label><input id="raza" class="block w-full rounded-md border-slate-300 px-3 py-2 text-sm shadow-sm focus:border-indigo-500 focus:ring-indigo-500" required />
          </div>
          <div>
            <label for="edad" class="mb-1.5 block text-sm font-medium text-slate-700">Edad</label
            ><input id="edad" class="block w-full rounded-md border-slate-300 px-3 py-2 text-sm shadow-sm focus:border-indigo-500 focus:ring-indigo-500" type="number" min="0" required />
          </div>
          <div class="sm:col-span-2">
            <label for="foto" class="mb-1.5 block text-sm font-medium text-slate-700">URL de foto</label
            ><input id="foto" class="block w-full rounded-md border-slate-300 px-3 py-2 text-sm shadow-sm focus:border-indigo-500 focus:ring-indigo-500" type="url" placeholder="https://..." />
          </div>
          <div class="flex items-center gap-2 sm:col-span-2">
            <input id="esSano" class="h-4 w-4 rounded border-slate-300 text-indigo-600 focus:ring-indigo-600" type="checkbox" checked />
            <label for="esSano" class="text-sm text-slate-700">Está sano</label>
          </div>
          <div class="flex gap-3 sm:col-span-2">
            <button type="submit" class="rounded-md bg-emerald-600 px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-600 focus:ring-offset-2">Guardar</button
            ><button type="button" class="rounded-md border border-slate-300 bg-white px-4 py-2 text-sm font-semibold text-slate-700 shadow-sm hover:bg-slate-50" id="cancelBtn">
              Cancelar
            </button>
          </div>
        </form>
        <div id="message" class="mx-6 mt-6" role="status" aria-live="polite"></div>
        <div class="overflow-x-auto">
          <table class="min-w-full divide-y divide-slate-200">
            <thead class="bg-slate-50">
              <tr>
                <th class="px-6 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-500">Foto</th>
                <th class="px-6 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-500">Nombre</th>
                <th class="px-6 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-500">Especie</th>
                <th class="px-6 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-500">Raza</th>
                <th class="px-6 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-500">Edad</th>
                <th class="px-6 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-500">Estado</th>
                <th class="px-6 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-500">Acciones</th>
              </tr>
            </thead>
            <tbody id="petList">
              <tr>
                <td colspan="7" class="px-6 py-8 text-center text-sm text-slate-500">Cargando mascotas...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>
    <script>
      const API = "http://localhost:3000/api/mascotas";
      const form = document.getElementById("petForm"),
        list = document.getElementById("petList"),
        message = document.getElementById("message");
      const fields = ["nombre", "especie", "raza", "edad", "foto"];
      const showMessage = (text) => {
        message.className = "mx-6 mt-6 rounded-md border border-blue-200 bg-blue-50 px-4 py-3 text-sm text-blue-800";
        message.textContent = text;
      };
      async function loadPets() {
        try {
          const response = await fetch(API);
          if (!response.ok) throw new Error();
          const pets = await response.json();
          render(pets);
        } catch {
          list.innerHTML =
            '<tr><td colspan="7" class="px-6 py-8 text-center text-sm text-slate-500">No se pudo conectar con el API.</td></tr>';
          showMessage(
            "Verifica que el servidor esté ejecutándose en localhost:3000.",
          );
        }
      }
      function render(pets) {
        if (!pets.length) {
          list.innerHTML =
            '<tr><td colspan="7" class="px-6 py-8 text-center text-sm text-slate-500">No hay mascotas registradas.</td></tr>';
          return;
        }
        list.innerHTML = pets
          .map(
            (p) =>
              `<tr class="divide-y divide-slate-100 hover:bg-slate-50"><td class="whitespace-nowrap px-6 py-4"><img class="h-16 w-16 rounded-md object-cover" src="${p.foto || ""}" alt="Foto de ${p.nombre}" onerror="this.style.visibility='hidden'"></td><td class="whitespace-nowrap px-6 py-4 text-sm font-medium text-slate-900">${p.nombre}</td><td class="whitespace-nowrap px-6 py-4 text-sm text-slate-600">${p.especie}</td><td class="whitespace-nowrap px-6 py-4 text-sm text-slate-600">${p.raza}</td><td class="whitespace-nowrap px-6 py-4 text-sm text-slate-600">${p.edad}</td><td class="whitespace-nowrap px-6 py-4"><span class="inline-flex rounded-full px-2.5 py-1 text-xs font-semibold ${p.esSano ? "bg-emerald-100 text-emerald-800" : "bg-amber-100 text-amber-800"}">${p.esSano ? "Sano" : "Necesita atención"}</span></td><td class="whitespace-nowrap px-6 py-4"><div class="flex flex-wrap gap-2"><button type="button" class="rounded-md border border-indigo-300 px-3 py-1.5 text-xs font-semibold text-indigo-700 hover:bg-indigo-50" onclick="editPet('${p._id || p.id}')">Editar</button><button type="button" class="rounded-md border border-rose-300 px-3 py-1.5 text-xs font-semibold text-rose-700 hover:bg-rose-50" onclick="deletePet('${p._id || p.id}')">Eliminar</button></div></td></tr>`,
          )
          .join("");
      }
      document.getElementById("newBtn").onclick = () => {
        form.reset();
        document.getElementById("petId").value = "";
        document.getElementById("esSano").checked = true;
        form.hidden = false;
      };
      document.getElementById("cancelBtn").onclick = () => (form.hidden = true);
      form.onsubmit = async (e) => {
        e.preventDefault();
        const id = document.getElementById("petId").value;
        const data = Object.fromEntries(
          fields.map((f) => [
            f,
            f === "edad"
              ? Number(document.getElementById(f).value)
              : document.getElementById(f).value,
          ]),
        );
        data.esSano = document.getElementById("esSano").checked;
        try {
          const r = await fetch(id ? `${API}/${id}` : API, {
            method: id ? "PUT" : "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data),
          });
          if (!r.ok) throw new Error();
          form.hidden = true;
          showMessage("Mascota guardada correctamente.");
          loadPets();
        } catch {
          showMessage("No se pudo guardar la mascota.");
        }
      };
      window.editPet = async (id) => {
        try {
          const r = await fetch(`${API}/${id}`);
          const p = await r.json();
          document.getElementById("petId").value = id;
          fields.forEach(
            (f) => (document.getElementById(f).value = p[f] ?? ""),
          );
          document.getElementById("esSano").checked = !!p.esSano;
          form.hidden = false;
        } catch {
          showMessage("No se pudo cargar la mascota.");
        }
      };
      window.deletePet = async (id) => {
        if (!confirm("¿Eliminar esta mascota?")) return;
        try {
          const r = await fetch(`${API}/${id}`, { method: "DELETE" });
          if (!r.ok) throw new Error();
          showMessage("Mascota eliminada.");
          loadPets();
        } catch {
          showMessage("No se pudo eliminar la mascota.");
        }
      };
      loadPets();
    </script>
  </body>
</html>
