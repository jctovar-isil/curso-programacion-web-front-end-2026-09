<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML básico</title>
    <style>
        /* Gestalt - Ley de Proximidad */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;   /* Espacio entre el label y el input */
            margin-bottom: 1.5rem; /* Espacio entre grupos de formulario */
        }
        label {
            font-size: 0.875rem;
            font-weight: 600;
            color: #374151;
        }
        input {
            padding: 0.5rem;
            border: 1px solid #D1D5DB;
            border-radius: 0.375rem;
            font-size: 1rem;
        }
        /* Gestalt - Ley de Cierre */
        .suscripcion {
            margin-top: 2rem;
        }
        .tarjeta {
            background-color: #F9FAFB;
            border: 1px solid #E1E7EB;
            border-radius: 0.375rem;
            padding: 1.5rem;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
            max-width: 300px;
        }
        .tarjeta h3 {
            margin-top: 0;
            font-size: 1.25rem;
            color: #111827;
        }
        .precio {
            font-size: 1.5rem;
            font-weight: 700;
            color: #BF1140;
        }
    </style>
</head>

<body>
    <h1>Hola, mundo</h1>
    <p>Este es un documento HTML básico.</p>
    <form class="formulario" action="#" method="post">
        <!-- Gestalt - Ley de Proximidad: Los elementos que están cerca unos de otros
            se perciben como un grupo -->
        <div class="form-group">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" placeholder="ej. Juan Perez">
        </div>
        <div class="form-group">
            <label for="email">Correo electrónico:</label>
            <input type="email" id="email" name="email" placeholder="ej. juan@ejemplo.com">
        </div>
        <!-- Gestalt - Ley de Semejanza: Los elementos que comparten características similares
             como color, forma o tamaño se perciben como un grupo -->
        <div class="acciones">
            <button type="submit" style="background-color: #BF1140; color: white; padding: 0.5rem 1rem; border: none; border-radius: 0.375rem;">Guardar</button>
            <button type="reset" style="background-color: #D99F7E; color: white; padding: 0.5rem 1rem; border: none; border-radius: 0.375rem;">Publicar</button>
            <button type="button" style="background-color: #8C113E; color: white; padding: 0.5rem 1rem; border: none; border-radius: 0.375rem;">Cancelar</button>
        </div>
        <!-- Gestalt - Ley de Cierre: Los elementos que forman una figura cerrada se perciben como un grupo -->
         <div class="suscripcion">
            <article class="tarjeta">
                <h3>Suscripción Pro</h3>
                <p>Acceso ilimitado a todos los cursos y recursos premium.</p>
                <span class="precio">$49.99/mes</span>
            </article>
         </div>
    </form>

</body>

</html>
